<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>No internet</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f8f7;
        color: #16201d;
        font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 22rem;
        background: #fff;
        border: 1px solid #e2e8e6;
        border-radius: 16px;
        padding: 28px 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 19px;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.5;
        color: #64756f;
      }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        background: #157060;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>No internet connection</h1>
      <p>This app needs internet to reach the society records. Check your mobile data or Wi-Fi, then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
